<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc"><title id="title">Guac proposed journey — Part 3.1</title><desc id="desc">Optional chat or direct exercise. Recommendation never starts a task. Support remains reachable and stop or leave is always allowed. History and preferences are optional.</desc><rect width="1000" height="1150" fill="#FAF8EF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4D7137" /></marker></defs><text x="42" y="52" fill="#243D25" font-family="Arial, sans-serif" font-size="30">Guac · a small pause, your way</text><text x="42" y="85" fill="#243D25" font-family="Arial, sans-serif" font-size="17">Part 3.1 proposed flow · everyday scenarios · no automatic exercise start</text><rect x="270" y="120" width="460" height="85" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="288" y="150" fill="#243D25" font-family="Arial, sans-serif" font-size="18">HOME: optional chat + both direct skills</text><text x="288" y="175" fill="#243D25" font-family="Arial, sans-serif" font-size="18">History/preferences disclosed on demand</text><path d="M360 205 L235 265" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><path d="M640 205 L755 265" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="265" width="380" height="120" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="63" y="295" fill="#243D25" font-family="Arial, sans-serif" font-size="18">OPTIONAL CHAT</text><text x="63" y="320" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Current feeling/context + preference</text><text x="63" y="345" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Bounded reflection/reason + allowed skill</text><rect x="575" y="265" width="380" height="120" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="593" y="295" fill="#243D25" font-family="Arial, sans-serif" font-size="18">DIRECT ENTRY</text><text x="593" y="320" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Choose breathing or grounding</text><text x="593" y="345" fill="#243D25" font-family="Arial, sans-serif" font-size="18">No typing, model wait or onboarding</text><path d="M235 385 L235 440" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><path d="M955 325 L980 325 L980 650 L800 650" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="440" width="380" height="120" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="63" y="470" fill="#243D25" font-family="Arial, sans-serif" font-size="18">RECOMMENDATION / QUESTION</text><text x="63" y="495" fill="#243D25" font-family="Arial, sans-serif" font-size="18">One question at most; skip answering</text><text x="63" y="520" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Accept, choose alternative or neither</text><rect x="575" y="440" width="380" height="100" rx="18" fill="#EEF1E0" stroke="#4D7137" /><text x="593" y="470" fill="#243D25" font-family="Arial, sans-serif" font-size="18">LOADING / FAILURE / LATE REPLY</text><text x="593" y="495" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Direct skills + support remain usable</text><text x="593" y="520" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Never interrupt active exercise</text><path d="M235 560 L415 595" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><rect x="200" y="595" width="600" height="110" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="218" y="625" fill="#243D25" font-family="Arial, sans-serif" font-size="18">DELIBERATE USER SELECTION ONLY</text><text x="218" y="650" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Breathing: 4s in / 6s out × 6 cycles; realistic green balloon</text><text x="218" y="675" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Grounding: 5 seen / 4 felt / 3 heard / 2 smelled / 1 tasted</text><path d="M500 705 L500 755" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><rect x="200" y="755" width="600" height="105" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="218" y="785" fill="#243D25" font-family="Arial, sans-serif" font-size="18">ACTIVE: one instruction, persistent pause/stop/support</text><text x="218" y="810" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Pause freezes clock + cue; reduced motion keeps timing</text><text x="218" y="835" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Stop/leave without penalty; no forced completion</text><path d="M500 860 L500 910" fill="none" stroke="#4D7137" stroke-width="2" marker-end="url(#arrow)" /><rect x="200" y="910" width="600" height="90" rx="18" fill="#DCE8AD" stroke="#4D7137" /><text x="218" y="940" fill="#243D25" font-family="Arial, sans-serif" font-size="18">OPTIONAL HISTORY / RETURN HOME</text><text x="218" y="965" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Save actual choice separately from recommendation</text><text x="218" y="990" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Review/repeat/clear; no clinical score or profile</text><rect x="45" y="1035" width="910" height="78" rx="18" fill="#EEF1E0" stroke="#4D7137" /><text x="63" y="1065" fill="#243D25" font-family="Arial, sans-serif" font-size="18">SUPPORT available from every state, independently of model/backend</text><text x="63" y="1090" fill="#243D25" font-family="Arial, sans-serif" font-size="18">Opening support pauses guidance; returning stays paused. Region verification is planned.</text><text x="42" y="1137" fill="#243D25" font-family="Arial, sans-serif" font-size="15">Design targets: about 65s whole guidance, ≤90s intended pace. Later milestones pending.</text></svg>